name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 文档同步校验：docs/commands.md 必须与命令注册表一致（防漂移）
      - name: Check docs sync
        run: pnpm check:docs

      - name: Build package
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Test coverage
        run: pnpm test:coverage

      # 性能回归门槛：生成 100 个玩具故事仓库并测量冷/热构建与 EPUB 导出耗时，
      # 超过内置阈值（bench/bench.ts 的 DEFAULT_CHECK_SPECS）即失败
      # shell: bash —— Windows runner 默认 PowerShell 不识别 rm -rf
      - name: Performance regression check
        shell: bash
        run: |
          node bench/generate.ts 100 bench-check
          node bench/bench.ts bench-check --check
          rm -rf bench-check
