name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build package
        run: pnpm build

      - name: Validate configs
        run: node dist/bin/index.js build --validate-only

      - name: Build READMEs
        run: node dist/bin/index.js build

      - name: Run tests
        run: pnpm test

      - name: Check git diff
        run: git diff --exit-code
