name: Build & Deploy (Manual Example)

# 手动触发的示例工作流 — 展示 story-cli Action 的用法
# 参考：此文件为示例展示，不会在 push 时自动执行
# 如有需要，可在 Actions 标签页手动触发运行
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build README
        uses: yuelinghuashu/story-cli@v1
        with:
          command: "build"

      - name: Export EPUB
        uses: yuelinghuashu/story-cli@v1
        with:
          command: "epub --all"

      - name: Upload EPUB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epub
          path: dist/epub/

      - name: Upload README
        uses: actions/upload-artifact@v4
        with:
          name: readme
          path: README.md